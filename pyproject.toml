[project]
name = "aegis-ajax-hass"
# Mirror of manifest.json's version (the source of truth HA reads). Kept in
# sync by tests/unit/test_version_consistency.py — bump both when releasing.
version = "1.15.1-beta.12"
description = "Home Assistant integration for Ajax Security Systems (co-branded) via gRPC"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # Floor dictated by the GRPC_GENERATED_VERSION stamped into the generated
    # service stubs: they raise RuntimeError on import under an older grpcio.
    "grpcio>=1.75.1",
    # Floor dictated by the gencode stamped into custom_components/aegis_ajax/proto:
    # protobuf refuses to load a stub generated by a newer version than the runtime.
    # Enforced by tests/unit/test_proto_gencode_version.py — do not lower it without
    # recompiling the stubs with an older grpcio-tools.
    "protobuf>=6.31.1",
    # When bumping past a release carrying sdb9696/firebase-messaging#39 (the
    # upstream reconnect-storm fix), revisit the local hardening — see #297.
    # Mirror any change in custom_components/aegis_ajax/manifest.json (JSON, no
    # comments — the source of truth HA reads).
    "firebase-messaging>=0.4.5",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = [
    # Pinned exactly, not floored: the compiler bakes its Protobuf gencode version
    # into every generated stub, so a floating version makes codegen unreproducible
    # and a rebuilt image silently raises what the stubs demand of the user's
    # runtime (#354). 1.75.1 emits gencode 6.31.1. Bumping this means recompiling
    # the whole proto tree and raising the protobuf floor above to match.
    "grpcio-tools==1.83.0",
    "homeassistant>=2024.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "mypy-protobuf>=3.5.0",
    "vulture>=2.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests against real Ajax API",
    "destructive: tests that modify system state (arm/disarm)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["custom_components/aegis_ajax/proto/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "A", "SIM", "TCH"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["custom_components/aegis_ajax/proto/"]

[tool.coverage.run]
omit = [
    "custom_components/aegis_ajax/proto/*",
]

[tool.vulture]
paths = ["custom_components/aegis_ajax", "vulture_whitelist.py"]
exclude = ["custom_components/aegis_ajax/proto/"]
min_confidence = 80

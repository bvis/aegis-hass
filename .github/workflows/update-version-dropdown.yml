name: Update version dropdown

# Keeps the bug-report issue form's "Integration version" dropdown in sync with
# published releases, so reporters can only pick a version that actually exists
# (kills phantom values like a mistyped "2.0.5"). The list is regenerated from
# `gh release list` between the AUTOGENERATED sentinels in bug_report.yml.

# Invoked by release.yml rather than listening for `release: published`. That
# trigger never fired: release.yml publishes through `softprops/action-gh-release`
# with the default GITHUB_TOKEN, and GitHub deliberately does not dispatch new
# workflow runs for events raised by that token (it is the loop guard). So this
# workflow logged zero runs from the day it was added, and the dropdown stayed
# frozen at 1.7.0-beta.8 — the newest release at the moment it was authored —
# for 200-plus releases. `workflow_call` makes the dependency explicit and needs
# no extra credential, unlike the usual PAT workaround.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-version-dropdown
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Refresh integration-version options
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_version_dropdown.py

      # Through the API, not `git push`: GitHub signs commits made this way, so
      # main can require signed commits without locking this job out.
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
          FORM: .github/ISSUE_TEMPLATE/bug_report.yml
        run: |
          if git diff --quiet "$FORM"; then
            echo "No change to commit."
            exit 0
          fi
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$(git rev-parse HEAD)" \
            --arg path "$FORM" \
            --arg contents "$(base64 -w0 "$FORM")" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                expectedHeadOid: $head,
                message: {headline: "chore: refresh issue-form version dropdown [skip ci]"},
                fileChanges: {additions: [{path: $path, contents: $contents}]}
              }}
            }' | gh api graphql --input -

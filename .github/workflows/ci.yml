name: CI

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Every requirement we declare is an open floor and the dev image installs
  # Home Assistant unpinned, so the environment our users end up with drifts
  # underneath us between commits. Rebuilding Dockerfile.dev from scratch
  # re-resolves all of it, so a weekly run turns "the outside world moved" into
  # a red build instead of a user report (#514).
  schedule:
    - cron: "13 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 is the oldest interpreter a supported core runs on (Home Assistant
        # 2025.11, our floor) and resolves the newest core of that band; 3.14 is
        # what every core from 2026.3 on requires, which is what users are
        # actually running. Testing below 3.13 tested an install nobody has (#513).
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dev container
        run: docker build -f Dockerfile.dev --build-arg PYTHON_VERSION=${{ matrix.python-version }} -t aegis-ajax-dev .
      - name: Run tests
        run: |
          mkdir -p coverage
          docker run --rm -v "$(pwd)/coverage:/coverage" aegis-ajax-dev \
            pytest tests/unit/ -v \
              --cov=custom_components/aegis_ajax \
              --cov-fail-under=80 \
              --cov-report=term-missing \
              --cov-report=json:/coverage/coverage.json
      - name: Coverage summary
        if: matrix.python-version == '3.13'
        run: |
          python3 -c "
          import json
          with open('coverage/coverage.json') as f:
              data = json.load(f)
          pct = data['totals']['percent_covered_display']
          stmts = data['totals']['num_statements']
          miss = data['totals']['missing_lines']
          print('## Test Coverage')
          print(f'| Metric | Value |')
          print(f'|--------|-------|')
          print(f'| **Coverage** | **{pct}%** |')
          print(f'| Statements | {stmts} |')
          print(f'| Missing | {miss} |')
          " >> "$GITHUB_STEP_SUMMARY"

  # The dev container installs the newest protobuf/grpcio satisfying our floors,
  # and a generated stub only fails to load when the runtime is *older* than the
  # compiler that built it — so the test suite is structurally unable to catch
  # that, and #354 shipped through a fully green CI. This job installs the exact
  # floors manifest.json advertises (the oldest runtime a user can end up with)
  # and imports every stub, so the floors we publish are floors we have run.
  proto-runtime-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Import every generated stub at the advertised runtime floors
        run: |
          docker run --rm -v "$(pwd)":/app -w /app python:3.13-slim bash -c '
            set -euo pipefail
            pip install --quiet --no-cache-dir --root-user-action=ignore \
              $(python3 scripts/check_proto_imports.py --floors)
            python3 scripts/check_proto_imports.py
          '

  # Home Assistant installs an integration's requirements through pip with its
  # own homeassistant/package_constraints.txt, which pins several of the packages
  # we depend on exactly. A floor of ours above the pin of the oldest core we
  # support cannot be resolved at all: the user gets "Requirements for aegis_ajax
  # not found" with nothing in our code to blame, which is how the integration
  # became uninstallable below 2025.11 without anyone noticing (#513). This job
  # is the guard: it re-derives that answer from the core's own constraints file
  # instead of trusting the number in hacs.json (#515).
  ha-requirement-floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve manifest requirements under the minimum core's constraints
        run: |
          docker run --rm -v "$(pwd)":/app -w /app python:3.13-slim \
            python3 scripts/check_ha_requirement_floors.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dev container
        run: docker build -f Dockerfile.dev -t aegis-ajax-dev .
      - name: Run linter
        run: docker run --rm aegis-ajax-dev ruff check .

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dev container
        run: docker build -f Dockerfile.dev -t aegis-ajax-dev .
      - name: Check formatting
        run: docker run --rm aegis-ajax-dev ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dev container
        run: docker build -f Dockerfile.dev -t aegis-ajax-dev .
      - name: Run type checker
        run: docker run --rm aegis-ajax-dev mypy custom_components/aegis_ajax/ --ignore-missing-imports --exclude 'proto/'

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dev container
        run: docker build -f Dockerfile.dev -t aegis-ajax-dev .
      - name: Run dead code analysis
        run: docker run --rm aegis-ajax-dev vulture custom_components/aegis_ajax/ vulture_whitelist.py --exclude custom_components/aegis_ajax/proto/


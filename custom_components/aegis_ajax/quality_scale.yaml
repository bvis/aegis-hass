# Home Assistant integration quality scale, self-assessed.
# Rules: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
# Not checked by hassfest for custom integrations; see docs/quality-scale.md.
rules:
  # Bronze
  action-setup:
    status: todo
    comment: Services are registered per config entry (#603).
  appropriate-polling: done
  brands:
    status: todo
    comment: Icon ships in brand/; submission to home-assistant/brands deferred.
  common-modules: done
  config-flow:
    status: todo
    comment: Config steps have no data_description (#610).
  config-flow-test-coverage:
    status: todo
    comment: Tests build the flow directly instead of using hass.config_entries.flow (#610).
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no device conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: todo
    comment: Ajax API failures are raised as ServiceValidationError (#607).
  config-entry-unloading:
    status: todo
    comment: Unload works; services are removed before the result is known and coordinator shutdown skips the base class (#603, #604).
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: todo
    comment: No platform sets PARALLEL_UPDATES (#606).
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: exempt
    comment: Cloud integration; the discovered host address is never used.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: todo
    comment: Only keyfobs are added at runtime; other new devices need a reload (#608).
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: todo
    comment: The Keyfobs device and the group name fallback are untranslated (#607).
  exception-translations:
    status: todo
    comment: About half of the raised errors have literal messages (#607).
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: Reconfigure deliberately allows switching Ajax account (#241) instead of aborting on a different unique_id.
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: The push listener creates its own aiohttp session (#612); the gRPC client has no web session to inject.
  strict-typing: done
